<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Usage widget</title>
    <link rel="stylesheet" href="/src/widget.css" />
  </head>
  <body>
    <!-- The whole surface is the button: one click opens the panel, and a drag
         moves it along the taskbar. Dragging is wired up in widget.js rather
         than with data-tauri-drag-region, because that starts the OS drag on
         mousedown and eats the click. -->
    <div id="widget" class="w">
      <!-- Both side edges resize. The right edge is the one the window is
           anchored by, so dragging that one trades width against the tray gap
           to keep the left edge still (see set_widget_width). Each grip hides
           when its side is up against the end of the bar and has nothing left
           to give. Kept siblings of the content, which gets replaced on every
           render. -->
      <div id="grip-l" class="grip l" title="Drag to resize"></div>
      <div id="grip-r" class="grip r" title="Drag to resize"></div>
      <div id="content" class="content"></div>
    </div>
    <script type="module" src="/src/widget.js"></script>
  </body>
</html>
